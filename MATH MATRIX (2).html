<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>MATH MATRIX</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one centred column. Header, a four-step level rail, then a single working card for the welcome, question or result. A kid character rises from the bottom edge after each answer. */
:root {
  --bg: #0e1620;
  --surface: #162231;
  --surface-2: #1d2d41;
  --line: #2a3d55;
  --fg: #e9eef5;
  --muted: #92a3b8;
  --accent: #f2b84b;
  --accent-ink: #1c1405;
  --good: #5fcf9a;
  --bad: #f27b7b;
  --shirt: #4aa8ff;
  --shirt-dark: #2f86d6;
  --skin: #e8b58c;
  --skin-shade: #c98f66;
  --hair: #2b1d16;
  --ink: #1b1410;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 32px 32px;
  background-position: -1px -1px;
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 100vh;
}
body.kid-pad { padding-bottom: 270px; }
body::after {
  content: "";
  position: fixed; inset: 0;
  background: radial-gradient(ellipse at 50% 0%, rgba(14,22,32,0) 0%, var(--bg) 85%);
  opacity: .78;
  pointer-events: none;
  z-index: 0;
}

/* Maths backdrop: drifting symbols and a sine wave, shared by every page */
.math-bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.math-bg .sym {
  position: absolute; font-family: var(--font-mono); font-weight: 700; color: var(--accent);
  opacity: .12; line-height: 1; user-select: none;
  animation: drift var(--d, 16s) ease-in-out infinite alternate;
}
.math-bg .sym.alt { color: var(--good); opacity: .1; }
.math-bg svg { position: absolute; left: 0; bottom: 0; width: 100%; height: 38vh; opacity: .22; }
.math-bg svg path { fill: none; stroke: var(--accent); stroke-width: 1.5; }
.math-bg svg path.b { stroke: var(--good); opacity: .6; }
@keyframes drift { from { transform: translate(0, 0) rotate(-4deg); } to { transform: translate(14px, -26px) rotate(5deg); } }

.wrap { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
header { display: flex; flex-direction: column; gap: 6px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(34px, 8vw, 52px); line-height: 1.02; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
.maker { margin: 0; font-family: var(--font-mono); font-size: 13px; color: var(--muted); letter-spacing: .04em; }
.maker b { color: var(--fg); font-weight: 700; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.tools { display: flex; gap: 8px; }
.home[aria-pressed="false"] { opacity: .65; text-decoration: line-through; }
.home { appearance: none; font: inherit; font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
.home:hover { color: var(--fg); border-color: var(--muted); }
.home:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.rail { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.step {
  appearance: none; font: inherit; color: inherit; text-align: left; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0;
  transition: border-color .15s, background .15s;
}
.step:hover { border-color: var(--muted); }
.step:focus-visible, .opt:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.step .n { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
.step .t { font-family: var(--font-display); font-weight: 700; font-size: 15px; line-height: 1.15; overflow-wrap: anywhere; }
.step .s { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.step.current { border-color: var(--accent); background: var(--surface-2); }
.step.current .n { color: var(--accent); }
.step.done .s { color: var(--good); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.stage-name { font-family: var(--font-display); font-weight: 700; font-size: 18px; }
.stage-name small { display: block; font-family: var(--font-body); font-weight: 400; font-size: 13px; color: var(--muted); }
.dots { display: flex; gap: 6px; }
.dot { width: 22px; height: 6px; border-radius: 3px; background: var(--line); }
.dot.on { background: var(--accent); }
.dot.ok { background: var(--good); }
.dot.no { background: var(--bad); }

.q { font-family: var(--font-mono); font-weight: 700; font-size: clamp(22px, 5.4vw, 30px); line-height: 1.3; letter-spacing: -.01em; margin: 0; overflow-wrap: anywhere; }
.qhint { font-size: 14px; color: var(--muted); margin: -10px 0 0; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.opt {
  appearance: none; font-family: var(--font-mono); font-weight: 500; font-size: 18px; color: var(--fg);
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px;
  padding: 14px 12px; cursor: pointer; text-align: center; min-width: 0; overflow-wrap: anywhere;
  transition: border-color .15s, background .15s;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--good); background: rgba(95, 207, 154, .14); animation: pop .55s cubic-bezier(.3, 1.6, .5, 1); }
.opt.wrong { border-color: var(--bad); background: rgba(242, 123, 123, .14); animation: shake .4s; }
.opt.dim { opacity: .5; }
@keyframes pop { 0% { transform: scale(.92); } 60% { transform: scale(1.07); } 100% { transform: scale(1); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

.feedback { border-left: 3px solid var(--line); padding: 2px 0 2px 14px; display: flex; flex-direction: column; gap: 2px; }
.feedback.ok { border-color: var(--good); }
.feedback.no { border-color: var(--bad); }
.feedback b { font-family: var(--font-display); font-size: 16px; }
.feedback span { color: var(--muted); font-size: 15px; overflow-wrap: anywhere; }

.row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn {
  appearance: none; font-family: var(--font-body); font-weight: 600; font-size: 16px; cursor: pointer;
  border-radius: 10px; padding: 12px 20px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg);
  transition: transform .1s, border-color .15s;
}
.btn:hover { border-color: var(--muted); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { border-color: var(--fg); }
.btn.big { font-family: var(--font-display); font-weight: 700; font-size: 20px; padding: 16px 34px; }

.welcome { gap: 26px; padding: 28px 22px; }
.welcome .formula { font-family: var(--font-mono); font-size: 14px; color: var(--muted); letter-spacing: .02em; overflow-wrap: anywhere; }
.welcome .formula b { color: var(--accent); font-weight: 700; }
.welcome h2 { font-family: var(--font-display); font-weight: 800; font-size: clamp(30px, 7vw, 44px); line-height: 1.05; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
.welcome p { margin: 0; color: var(--muted); max-width: 50ch; }
.lvl-label { font-family: var(--font-mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.levels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.lvl {
  appearance: none; font: inherit; color: inherit; text-align: left; cursor: pointer; min-width: 0;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 14px;
  display: flex; flex-direction: column; gap: 4px; transition: border-color .15s, background .15s;
}
.lvl:hover { border-color: var(--muted); }
.lvl:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.lvl[aria-pressed="true"] { border-color: var(--accent); background: rgba(242, 184, 75, .1); }
.lvl .sigma { font-family: var(--font-mono); font-weight: 700; font-size: 22px; color: var(--accent); line-height: 1; }
.lvl .ln { font-family: var(--font-display); font-weight: 700; font-size: 17px; line-height: 1.15; }
.lvl .ld { font-size: 13px; color: var(--muted); }
.lvl .ls { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.lvl .ls.ok { color: var(--good); }

/* Vs AI mode: scores sit in the top corners, yours on the left and the AI's on the right */
.board {
  position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); z-index: 7;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 6px 14px; min-width: 96px; display: flex; flex-direction: column; transition: border-color .2s;
}
.board.you { left: max(12px, env(safe-area-inset-left, 0px)); }
.board.ai { right: max(12px, env(safe-area-inset-right, 0px)); align-items: flex-end; }
.board .bl { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.board .bv { font-family: var(--font-mono); font-weight: 700; font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; display: inline-block; }
.board.you .bv { color: var(--accent); }
.board.ai .bv { color: var(--shirt); }
.board.lead { border-color: var(--good); }
.bv.bump { animation: bump .5s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.3); } 100% { transform: scale(1); } }
body.vs { padding-top: 88px; }
.vs-info { display: flex; flex-direction: column; gap: 8px; }
.vs-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.vs-row b { font-family: var(--font-display); }
.vs-row span { font-family: var(--font-mono); color: var(--muted); font-size: 13px; }
.ai-line { font-family: var(--font-mono); font-size: 14px; color: var(--muted); }
.ai-line.ok { color: var(--shirt); }
.vs-total { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; width: 100%; }
.vs-total div { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 2px; }
.vs-total small { font-family: var(--font-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.vs-total b { font-family: var(--font-mono); font-size: 28px; font-variant-numeric: tabular-nums; }
.vs-total .yb { color: var(--accent); }
.vs-total .ab { color: var(--shirt); }

.result-box { display: flex; flex-direction: column; gap: 18px; align-items: flex-start; }
.score { font-family: var(--font-mono); font-weight: 700; font-size: clamp(54px, 16vw, 84px); line-height: 1; font-variant-numeric: tabular-nums; }
.score span { color: var(--muted); font-size: .5em; }
.result-box h2 { font-family: var(--font-display); font-weight: 800; font-size: 26px; margin: 0; text-wrap: balance; }
.result-box p { margin: 0; color: var(--muted); max-width: 52ch; }
.breakdown { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; width: 100%; }
.breakdown div { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 14px; display: flex; justify-content: space-between; gap: 8px; }
.breakdown b { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
footer { font-family: var(--font-mono); font-size: 12px; color: var(--muted); letter-spacing: .04em; }

/* The kid: rises from the bottom edge after every answer. Thumbs up when right, a raised finger and an explanation when wrong. */
.kid {
  position: fixed; bottom: 0; right: max(10px, env(safe-area-inset-right, 0px)); z-index: 6;
  display: flex; align-items: flex-end; gap: 4px; max-width: calc(100vw - 20px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  transform: translateY(120%); transition: transform .6s cubic-bezier(.18, 1.3, .4, 1);
  pointer-events: none;
}
.kid.up { transform: translateY(0); }
.kid-svg { width: clamp(92px, 24vw, 130px); height: auto; flex: none; display: block; }
.kid .t-only { display: none; }
.kid.think .t-only { display: inline; }
.kid.think .h-only { display: none; }
.kid.up .arm { transform-origin: 94px 122px; animation: wave .5s ease-in-out .55s 3 alternate; }
.kid.think.up .arm { animation-name: nod; animation-iteration-count: 4; }
.kid.think .bulb { animation: glow 1s ease-in-out infinite alternate; }
@keyframes wave { from { transform: rotate(-8deg); } to { transform: rotate(8deg); } }
@keyframes nod { from { transform: rotate(-3deg); } to { transform: rotate(5deg); } }
@keyframes glow { from { opacity: .65; } to { opacity: 1; } }
.bubble {
  position: relative; margin-bottom: 56px; max-width: min(250px, 58vw);
  background: var(--surface-2); border: 2px solid var(--good); border-radius: 16px;
  padding: 10px 14px; font-size: 14px; line-height: 1.4; color: var(--fg); overflow-wrap: anywhere;
}
.bubble.no { border-color: var(--accent); }
.bubble.ok { font-family: var(--font-display); font-weight: 700; font-size: 17px; }
.bubble::after {
  content: ""; position: absolute; right: -9px; bottom: 16px; width: 14px; height: 14px;
  background: var(--surface-2); border-right: 2px solid var(--good); border-top: 2px solid var(--good);
  transform: rotate(45deg);
}
.bubble.no::after { border-color: var(--accent); }

.confetti { position: fixed; inset: 0; z-index: 5; overflow: hidden; pointer-events: none; }
.confetti i { position: absolute; top: -20px; border-radius: 2px; animation: fall linear forwards; }
@keyframes fall { 0% { transform: translate(0, 0) rotate(0); opacity: 1; } 85% { opacity: 1; } 100% { transform: translate(var(--dx), 105vh) rotate(var(--r)); opacity: 0; } }

/* Opening screen: a coordinate plane with curves that draw themselves, formulas drifting behind, and a Start button */
.splash {
  position: fixed; inset: 0; z-index: 20; display: flex; overflow: hidden;
  background-color: var(--bg);
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 32px 32px; background-position: -1px -1px;
  transition: opacity .5s ease, transform .5s ease;
}
.splash::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(to top, var(--bg) 0%, rgba(14, 22, 32, .88) 32%, rgba(14, 22, 32, 0) 68%);
}
.splash.leaving { opacity: 0; transform: translateY(-24px); pointer-events: none; }
body.splash-on { overflow: hidden; }
.sp-art { position: absolute; inset: 0; pointer-events: none; }
.sp-art svg { width: 100%; height: 100%; display: block; }
.sp-art .ax { stroke: var(--muted); stroke-width: 1.2; opacity: .5; }
.sp-art .curve { fill: none; stroke-width: 3.5; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2.6s ease-out forwards; }
.sp-art .c1 { stroke: var(--accent); }
.sp-art .c2 { stroke: var(--good); animation-delay: .5s; }
.sp-art .unit { fill: none; stroke: var(--shirt); stroke-width: 2; stroke-dasharray: 6 6; opacity: .75; }
.sp-art .tri { fill: rgba(74, 168, 255, .12); stroke: var(--shirt); stroke-width: 2.5; stroke-linejoin: round; }
.sp-art .rt { fill: none; stroke: var(--shirt); stroke-width: 2; }
.sp-art text { font-family: var(--font-mono); font-size: 20px; fill: var(--muted); }
.sp-art text.hl { fill: var(--fg); }
@keyframes draw { to { stroke-dashoffset: 0; } }
.sp-f { position: absolute; font-family: var(--font-mono); font-weight: 500; color: var(--accent); opacity: .24; white-space: nowrap; animation: drift var(--d, 16s) ease-in-out infinite alternate; }
.sp-f.alt { color: var(--shirt); }
.sp-body {
  position: relative; z-index: 1; width: 100%; max-width: 720px; margin: 0 auto;
  display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start; gap: 16px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 24px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + max(40px, 10vh));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sp-title { font-family: var(--font-display); font-weight: 800; font-size: clamp(60px, 17vw, 128px); line-height: .9; letter-spacing: -.03em; margin: 0; }
.sp-title span { color: var(--accent); }
.sp-tags { font-family: var(--font-mono); font-size: 13px; letter-spacing: .12em; color: var(--muted); white-space: pre; }

/* Mode deck: swipe or drag sideways between the three modes */
.deck { overflow: hidden; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); touch-action: pan-y; cursor: grab; user-select: none; -webkit-user-select: none; }
.deck:active { cursor: grabbing; }
.deck:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.track { display: flex; transition: transform .35s cubic-bezier(.2, .8, .2, 1); will-change: transform; }
.track.dragging { transition: none; }
.panel { flex: 0 0 100%; min-width: 0; padding: 20px; display: flex; flex-direction: column; gap: 6px; }
.panel .ptag { font-family: var(--font-mono); font-weight: 700; font-size: 34px; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.panel .pn { font-family: var(--font-display); font-weight: 800; font-size: 26px; line-height: 1.1; }
.panel .pd { color: var(--muted); font-size: 15px; max-width: 46ch; }
.deck-nav { display: flex; align-items: center; justify-content: center; gap: 14px; }
.arrow { appearance: none; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); font-size: 22px; line-height: 1; cursor: pointer; padding: 0 0 3px; }
.arrow:hover:not(:disabled) { border-color: var(--accent); }
.arrow:disabled { opacity: .35; cursor: default; }
.arrow:focus-visible, .pip:focus-visible, .chip:focus-visible, .preset:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pips { display: flex; gap: 8px; }
.pip { appearance: none; width: 28px; height: 8px; border-radius: 4px; border: 0; background: var(--line); cursor: pointer; padding: 0; }
.pip[aria-pressed="true"] { background: var(--accent); }
.mode-config { display: flex; flex-direction: column; gap: 12px; }

/* Fast & Furious setup: topic chips and a custom stopwatch */
.chips { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.chip { appearance: none; font: inherit; color: inherit; text-align: left; cursor: pointer; min-width: 0; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; transition: border-color .15s, background .15s; }
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"] { border-color: var(--accent); background: rgba(242, 184, 75, .1); }
.chip .ct { font-family: var(--font-mono); font-weight: 700; font-size: 16px; color: var(--accent); line-height: 1.1; }
.chip .cn { font-family: var(--font-display); font-weight: 700; font-size: 14px; line-height: 1.15; overflow-wrap: anywhere; }
.stopwatch { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px; align-items: center; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.swdisplay { font-family: var(--font-mono); font-weight: 700; font-size: clamp(36px, 10vw, 48px); line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; min-width: 4.4ch; }
.sw-side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.presets { display: flex; gap: 6px; flex-wrap: wrap; }

<script>
/* ---------- Question generators: every try builds brand new numbers ---------- */
const sup = n => String(n).split("").map(d => "⁰¹²³⁴⁵⁶⁷⁸⁹"[+d]).join("");
const ri = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pickOf = arr => arr[ri(0, arr.length - 1)];
const gcd = (a, b) => b ? gcd(b, a % b) : Math.abs(a);
const frac = (n, d) => { const g = gcd(n, d); n /= g; d /= g; return d === 1 ? String(n) : n + "/" + d; };
function shuffle(a) {
  const b = a.slice();
  for (let k = b.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [b[k], b[j]] = [b[j], b[k]]; }
  return b;
}
// Puts the correct answer at a random spot among three distinct wrong ones.
function finish(q, correct, wrongs, e, h) {
  const w = [];
  for (const x of wrongs) { if (x !== correct && !w.includes(x)) w.push(x); if (w.length === 3) break; }
  if (w.length < 3) return null;
  const pos = ri(0, 3);
  const o = w.slice();
  o.splice(pos, 0, correct);
  return { q, o, a: pos, e, h };
}
function num(q, ans, cands, e, fmt, h) {
  fmt = fmt || String;
  const w = [];
  for (const c of cands) { if (Number.isFinite(c) && c > 0 && c !== ans && !w.includes(c)) w.push(c); }
  for (let k = 1; w.length < 3; k++) {
    for (const c of [ans + k, ans - k]) { if (c > 0 && c !== ans && !w.includes(c) && w.length < 3) w.push(c); }
  }
  return finish(q, fmt(ans), w.slice(0, 3).map(fmt), e, h);
}
function term(c, e) {
  if (e === 0) return String(c);
  return (c === 1 ? "" : String(c)) + "x" + (e === 1 ? "" : sup(e));
}

// Level 1: Foundations
function g11() { const a = ri(20, 89), b = ri(20, 89), s = a + b;
  return num(`${a} + ${b} = ?`, s, [s + 10, s - 10, s + 2, s - 1], `${a} + ${b} = ${s}. Add the tens first, then the ones.`); }
function g12() { const a = ri(6, 12), b = ri(6, 12), p = a * b;
  return num(`${a} × ${b} = ?`, p, [p + a, p - b, p + 10, p - 10], `${a} × ${b} = ${p}. Think of ${a} groups of ${b}.`); }
function g13() { const b = ri(3, 12), q = ri(6, 15), n = b * q;
  return num(`${n} ÷ ${b} = ?`, q, [q + 1, q - 1, q + 2, q - 2], `${b} × ${q} = ${n}, so ${n} ÷ ${b} = ${q}.`); }
function g14() { const a = pickOf([100, 200, 300]), b = ri(21, 79), d = a - b;
  return num(`${a} − ${b} = ?`, d, [d + 10, d - 10, d + 2, d - 2], `Take ${b} away from ${a} and you are left with ${d}.`); }
function g15() { const n = ri(5, 12), k = ri(2, 9), v = n * n + k;
  return num(`${n}² + ${k} = ?`, v, [2 * n + k, v + 10, n * n - k, v - 1], `${n}² means ${n} × ${n} = ${n * n}, and ${n * n} + ${k} = ${v}.`); }

// Level 2: Fractions and percent
function g21() { const d = pickOf([2, 3, 4, 5]), nu = ri(1, d - 1), k = ri(4, 20), N = d * k, ans = nu * k;
  return num(`${nu}/${d} of ${N} = ?`, ans, [k, N - ans, ans + k, ans - k], `Split ${N} into ${d} equal parts of ${k}, then take ${nu} of them: ${nu} × ${k} = ${ans}.`); }
function g22() { const p = pickOf([10, 20, 25, 50, 75]), N = ri(1, 20) * 20, ans = p * N / 100;
  return num(`${p}% of ${N} = ?`, ans, [N - ans, ans * 2, ans + 10, ans - 5], `${p}% of ${N} = ${p}/100 × ${N} = ${ans}.`); }
function g23() { const d = pickOf([4, 5, 8, 20, 25]), nu = ri(1, d - 1), pct = nu * 100 / d;
  return num(`${nu}/${d} as a percentage?`, pct, [pct + 5, pct - 10, 100 - pct, pct + 10], `${nu} ÷ ${d} = ${nu / d}, and multiplying by 100 gives ${pct}%.`, x => x + "%"); }
function g24() { const b = ri(2, 9), d = ri(2, 9), a = ri(1, b - 1), c = ri(1, d - 1), ans = frac(a * c, b * d);
  return finish(`${a}/${b} × ${c}/${d} = ?`, ans, [frac(a * d, b * c), frac(a + c, b + d), frac(a * c, b + d), frac(a * c + 1, b * d), frac(a * c, b * d + 1)],
    `Multiply the tops (${a} × ${c} = ${a * c}) and the bottoms (${b} × ${d} = ${b * d}), then reduce if you can: ${ans}.`); }
function g25() { const P = pickOf([400, 500, 600, 800, 1000, 1200, 1500, 2000]), dsc = pickOf([10, 15, 20, 25, 30]), off = P * dsc / 100, sale = P - off;
  return num(`A ₹${P} item gets ${dsc}% off. Sale price?`, sale, [off, P - dsc, sale + dsc, sale + off / 2], `${dsc}% of ${P} is ₹${off}, and ${P} − ${off} = ₹${sale}.`, x => "₹" + x); }

// Level 3: Algebra and geometry
function g31() { const a = ri(2, 9), x = ri(2, 12), b = ri(1, 15), c = a * x + b;
  return num(`Solve: ${a}x + ${b} = ${c}`, x, [a * x, x + 1, x - 1, x + 2], `Subtract ${b} from both sides to get ${a}x = ${a * x}, then divide by ${a}.`, v => "x = " + v); }
function g32() { const bs = pickOf([4, 6, 8, 10, 12, 14, 16, 18, 20]), h = ri(3, 15), area = bs * h / 2;
  return num(`Area of a triangle with base ${bs} and height ${h}?`, area, [bs * h, bs + h, area + h, area + bs]
    , `Area = ½ × base × height = ½ × ${bs} × ${h} = ${area}.`); }
function g33() { let p = ri(1, 6), q = ri(1, 6); while (p === q) q = ri(1, 6);
  const ans = `x² + ${p + q}x + ${p * q}`;
  return finish(`(x + ${p})(x + ${q}) = ?`, ans, [`x² + ${p * q}x + ${p + q}`, `x² + ${p + q}x + ${p + q}`, `x² + ${p * q}`, `x² + ${p * q}x + ${p * q}`],
    `Multiply each pair: x² + ${q}x + ${p}x + ${p * q} = x² + ${p + q}x + ${p * q}.`); }
function g34() { const k = ri(1, 5), r = 7 * k, C = 44 * k, area = 154 * k * k;
  return num(`Circumference of a circle with radius ${r}?`, C, [area, 22 * k, C + 22, C * 2], `Circumference = 2πr = 2 × 22/7 × ${r} = ${C}.`, String, "Use π ≈ 22/7."); }
function g35() { const t = pickOf([[3, 4, 5], [5, 12, 13], [8, 15, 17], [6, 8, 10], [9, 12, 15], [7, 24, 25], [20, 21, 29]]), sw = Math.random() < .5, a = sw ? t[1] : t[0], b = sw ? t[0] : t[1], c = t[2];
  return num(`Right triangle with legs ${a} and ${b}. Hypotenuse?`, c, [a + b, c + 1, c - 1, c + 2], `${a}² + ${b}² = ${a * a} + ${b * b} = ${c * c}, and √${c * c} = ${c}.`); }

// Level 4: Challenge
function g41() { const n = ri(2, 6), a = ri(1, 5), ans = term(a * n, n - 1);
  return finish(`d/dx of ${term(a, n)} = ?`, ans, [term(a, n - 1), term(a * n, n), `${a === 1 ? "" : a}x${sup(n + 1)}/${n + 1}`, term(a * n, n + 1)],
    `Power rule: bring the power ${n} down to multiply the coefficient (${a} × ${n} = ${a * n}) and lower the power by one. That gives ${ans}.`); }
function g42() { const n = pickOf([20, 30, 40, 50, 60, 80, 100, 200]), s = n * (n + 1) / 2;
  return num(`1 + 2 + 3 + … + ${n} = ?`, s, [n * (n + 1), n * (n - 1) / 2, n * n / 2, s + n], `Use n(n + 1)/2 = ${n} × ${n + 1} / 2 = ${s}.`); }
function g43() { const s = ri(3, 11); let cnt = 0;
  for (let a = 1; a <= 6; a++) for (let b = 1; b <= 6; b++) if (a + b === s) cnt++;
  const ans = frac(cnt, 36);
  return finish(`Two fair dice are rolled. P(sum = ${s})?`, ans, [frac(cnt + 1, 36), frac(cnt - 1, 36), frac(cnt, 12), frac(cnt, 18), frac(1, 36)],
    `${cnt} of the 36 equally likely outcomes add up to ${s}. That is ${cnt}/36` + (ans === cnt + "/36" ? "." : `, or ${ans} in simplest form.`)); }
function g44() { const r1 = ri(1, 8), r2 = ri(r1 + 1, 9), S = r1 + r2, P = r1 * r2, ans = `x = ${r1} or ${r2}`;
  return finish(`Solve: x² − ${S}x + ${P} = 0`, ans, [`x = −${r1} or −${r2}`, `x = ${r1 + 1} or ${r2 + 1}`, `x = 1 or ${P}`, `x = ${r1} or ${r2 + 2}`],
    `Find two numbers that multiply to ${P} and add to ${S}: ${r1} and ${r2}. So (x − ${r1})(x − ${r2}) = 0.`); }
function g45() { const base = pickOf([2, 3, 7, 8]), n = ri(30, 2030);
  const cycle = []; let v = 1;
  for (let i = 0; i < 4; i++) { v = (v * base) % 10; cycle.push(v); }
  let d = 1; for (let i = 0; i < n; i++) d = (d * base) % 10;
  const pos = n % 4 === 0 ? 4 : n % 4;
  return num(`Last digit of ${base}${sup(n)}?`, d, cycle.concat([1, 5, 9, 6]), `Last digits of powers of ${base} repeat as ${cycle.join(", ")}. ${n} is position ${pos} in that cycle, so the last digit is ${d}.`); }
// Trigonometry and extra probability (used by Fast & Furious)
const EXACT = { sin: ["0", "1/2", "√2/2", "√3/2", "1"], cos: ["1", "√3/2", "√2/2", "1/2", "0"], tan: ["0", "1/√3", "1", "√3", "undefined"] };
const ANGLES = [0, 30, 45, 60, 90];
const TRIG_POOL = ["0", "1/2", "√2/2", "√3/2", "1", "√3", "1/√3", "2"];
function gT1() {
  const fn = pickOf(["sin", "cos", "tan"]);
  const i = fn === "tan" ? ri(0, 3) : ri(0, 4);
  const ans = EXACT[fn][i];
  return finish(`${fn} ${ANGLES[i]}° = ?`, ans, shuffle(TRIG_POOL),
    `At 0°, 30°, 45°, 60° and 90°, ${fn} takes the values ${EXACT[fn].join(", ")}. So ${fn} ${ANGLES[i]}° = ${ans}.`);
}
const IDENT = [
  ["1 − sin²θ", "cos²θ", "sin²θ + cos²θ = 1, so 1 − sin²θ = cos²θ."],
  ["1 − cos²θ", "sin²θ", "sin²θ + cos²θ = 1, so 1 − cos²θ = sin²θ."],
  ["sin θ / cos θ", "tan θ", "tan θ is defined as sin θ divided by cos θ."],
  ["cos θ / sin θ", "cot θ", "cot θ is defined as cos θ divided by sin θ."],
  ["1 / cos θ", "sec θ", "sec θ is the reciprocal of cos θ."],
  ["1 / sin θ", "cosec θ", "cosec θ is the reciprocal of sin θ."],
  ["sin²θ + cos²θ", "1", "This identity holds for every angle θ."]
];
const IDENT_POOL = ["sin²θ", "cos²θ", "tan θ", "cot θ", "sec θ", "cosec θ", "1"];
function gT2() { const [x, ans, e] = pickOf(IDENT); return finish(`${x} = ?`, ans, shuffle(IDENT_POOL), e); }
function gT3() {
  const t = pickOf([[3, 4, 5], [5, 12, 13], [8, 15, 17], [7, 24, 25], [20, 21, 29]]), sw = Math.random() < .5;
  const opp = sw ? t[1] : t[0], adj = sw ? t[0] : t[1], hyp = t[2];
  const fn = pickOf(["sin", "cos", "tan"]);
  const R = { sin: [opp, hyp, "opposite ÷ hypotenuse"], cos: [adj, hyp, "adjacent ÷ hypotenuse"], tan: [opp, adj, "opposite ÷ adjacent"] };
  const [n, d, rule] = R[fn];
  const ans = frac(n, d);
  return finish(`Right triangle: opposite = ${opp}, adjacent = ${adj}, hypotenuse = ${hyp}. ${fn} A = ?`, ans,
    [frac(adj, hyp), frac(opp, hyp), frac(opp, adj), frac(adj, opp), frac(hyp, opp), frac(hyp, adj)], `${fn} A = ${rule} = ${n}/${d}.`);
}

function chapTop() { try { if (window.scrollTo) window.scrollTo(0, 0); } catch (e) {} }
function backBtn(label, fn) {

function sectionTabs(active) {

// A set of 10 questions drawn at random from the chapter's bank, options shuffled
function chapterQuestions(n) {
  return shuffle(CH_BANK[n]).slice(0, CHAP_Q).map(r => {
    const opts = shuffle([{ t: r[1], ok: true }, { t: r[2] }, { t: r[3] }, { t: r[4] }]);
    return { q: r[0], o: opts.map(x => x.t), a: opts.findIndex(x => x.ok), e: r[5] };
  });
}

function chaptersHome(card) {
  card.append(el("h2", "", "Class 10 Maths"),
    el("p", "", "Pick a chapter. Read its summary, then take a 10 question quiz. Each try draws a different set of questions."));

function chapterIntro(n) {
  const c = CH10.find(x => x.n === n);

  run = null;

function startChapterQuiz(n) {
  const c = CH10.find(x => x.n === n);

function renderChapResult(card, S) {

  wrap.append(el("h2", "", title), el("p", "", body));

const MODES = [
  { id: "practice", tag: "1P", name: "Practice", desc: "Climb four levels at your own pace. Score 6 out of 10 to clear each one.", start: "Start" },
  { id: "vs", tag: "VS", name: "1 Player vs AI", desc: "Race an AI through all four levels. It gets sharper every level.", start: "Start match" },

];

function renderConfig(box) {
  box.replaceChildren();
  if (state.mode === "vs") {
    box.append(el("div", "lvl-label", "How the match works"));
    const info = el("div", "vs-info");
    STAGES.forEach((s, i) => {
      const r = el("div", "vs-row");
      r.append(el("b", "", "Level " + (i + 1) + " · " + s.name), el("span", "", AI_TIERS[i].name + " AI · " + (10 * (i + 1)) + " pts per answer"));
      info.append(r);
    });
    box.append(info);
    return;
  }
  if (state.mode === "fast") {
    box.append(el("div", "lvl-label", "Choose a topic"));
    const chips = el("div", "chips");
    const chipEls = TOPICS.map(t => {
      const b = el("button", "chip");
      b.type = "button";
      b.append(el("span", "ct", t.tag), el("span", "cn", t.name));
      b.addEventListener("click", () => { state.fast.topic = t.id; save(); sync(); });
      chips.append(b);
      return b;
    });
    box.append(chips, el("div", "lvl-label", "Set your stopwatch"));
    const sw = el("div", "stopwatch");
    const disp = el("div", "swdisplay");
    const side = el("div", "sw-side");
    const presets = el("div", "presets");
    const presetEls = FAST_PRESETS.map(s => {
      const b = el("button", "preset", s + " s");
      b.type = "button";
      b.addEventListener("click", () => {
        state.fast.secs = s; save();
        inp.value = String(s);
        inp.setAttribute("aria-invalid", "false");
        sync();
      });
      presets.append(b);
      return b;
    });
    const lab = el("label", "custom");
    lab.setAttribute("for", "fastSecs");
    lab.append(el("span", "", "Custom seconds (10 to 600)"));
    const inp = el("input");
    inp.id = "fastSecs";
    inp.type = "number";
    inp.setAttribute("min", "10");
    inp.setAttribute("max", "600");
    inp.setAttribute("step", "5");
    inp.setAttribute("inputmode", "numeric");
    inp.value = String(state.fast.secs);
    lab.append(inp);
    const best = el("div", "best-line");
    function sync() {
      chipEls.forEach((b, i) => b.setAttribute("aria-pressed", String(TOPICS[i].id === state.fast.topic)));
      presetEls.forEach((b, i) => b.setAttribute("aria-pressed", String(FAST_PRESETS[i] === state.fast.secs)));
      disp.textContent = fmtTime(state.fast.secs * 1000);
      const bs = (state.best || {})[state.fast.topic + "-" + state.fast.secs];
      best.textContent = bs ? "Your best here: " + bs + " pts" : "No score yet for this topic and time.";
    }
    inp.addEventListener("input", () => {
      const v = parseInt(inp.value, 10);
      const ok = Number.isFinite(v) && v >= 10 && v <= 600;
      inp.setAttribute("aria-invalid", String(!ok));
      if (ok) { state.fast.secs = v; save(); sync(); }
    });
    inp.addEventListener("change", () => { inp.value = String(state.fast.secs); inp.setAttribute("aria-invalid", "false"); });
    side.append(presets, lab);
    sw.append(disp, side);
    box.append(sw, best);
    sync();
    return;
  }
  box.append(el("div", "lvl-label", "Choose your level"));
  const lv = el("div", "levels");
  STAGES.forEach((s, i) => {
    const b = el("button", "lvl");

      state.stage = i; save();

function showWelcome() {
  stopFast();
  run = null;
  hideKid();
  showBoard(false);
  document.getElementById("rail").hidden = true;
  document.getElementById("homeBtn").hidden = true;
  const card = document.getElementById("card");

  card.replaceChildren();
  card.append(sectionTabs(state.section));
  if (state.section === "chapters") { chaptersHome(card); return; }
  const f = el("div", "formula");
  f.append(document.createTextNode("a² + b² = c²   ·   "), el("b", "", "n(n+1)/2"), document.createTextNode("   ·   e^(iπ) + 1 = 0"));
  card.append(f, el("h2", "", "Pick a mode and play."),
    el("p", "", "Climb four levels, race an AI, or beat the clock on the topic you choose. The numbers change every time."));
  card.append(el("div", "lvl-label", "Choose mode · swipe, drag or use the arrows"));

  const deck = el("div", "deck");
  deck.tabIndex = 0;
  deck.setAttribute("role", "group");
  deck.setAttribute("aria-roledescription", "carousel");
  deck.setAttribute("aria-label", "Game modes. Use the left and right arrow keys to switch.");
  const track = el("div", "track");
  MODES.forEach(m => {
    const p = el("div", "panel");
    p.append(el("span", "ptag", m.tag), el("span", "pn", m.name), el("span", "pd", m.desc));
    track.append(p);
  });
  deck.append(track);

  const nav = el("div", "deck-nav");
  const prevB = el("button", "arrow", "‹");
  prevB.type = "button";
  prevB.setAttribute("aria-label", "Previous mode");
  const nextB = el("button", "arrow", "›");
  nextB.type = "button";
  nextB.setAttribute("aria-label", "Next mode");
  const pips = el("div", "pips");
  const pipEls = MODES.map(m => {
    const b = el("button", "pip");
    b.type = "button";
    b.setAttribute("aria-label", "Show " + m.name);
    pips.append(b);
    return b;
  });
  nav.append(prevB, pips, nextB);

  const cfgBox = el("div", "mode-config");
  const row = el("div", "row");
  const go = el("button", "btn primary big", "Start");
  go.type = "button";
  row.append(go);
  card.append(deck, nav, cfgBox, row);

  const cur = () => Math.max(0, MODES.findIndex(m => m.id === state.mode));
  function show(i, force) {
    i = Math.max(0, Math.min(MODES.length - 1, i));
    const changed = MODES[i].id !== state.mode;
    state.mode = MODES[i].id;
    if (changed) save();
    track.style.transform = "translateX(" + (-i * 100) + "%)";
    pipEls.forEach((b, k) => b.setAttribute("aria-pressed", String(k === i)));
    prevB.disabled = i === 0;
    nextB.disabled = i === MODES.length - 1;
    go.textContent = MODES[i].start;
    if (changed || force) renderConfig(cfgBox);
  }
  prevB.addEventListener("click", () => show(cur() - 1));
  nextB.addEventListener("click", () => show(cur() + 1));
  pipEls.forEach((b, k) => b.addEventListener("click", () => show(k)));
  deck.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") { e.preventDefault(); show(cur() - 1); }
    if (e.key === "ArrowRight") { e.preventDefault(); show(cur() + 1); }
  });

  // Swipe or drag sideways to change mode (touch, pen and mouse)
  let sx = 0, dx = 0, drag = false;
  deck.addEventListener("pointerdown", e => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    drag = true; sx = e.clientX; dx = 0;
    track.classList.add("dragging");
    try { deck.setPointerCapture(e.pointerId); } catch (err) {}
  });
  deck.addEventListener("pointermove", e => {
    if (!drag) return;
    dx = e.clientX - sx;
    const i = cur();
    const edge = (i === 0 && dx > 0) || (i === MODES.length - 1 && dx < 0);
    track.style.transform = "translateX(calc(" + (-i * 100) + "% + " + (edge ? dx * 0.3 : dx) + "px))";
  });
  const endDrag = () => {
    if (!drag) return;
    drag = false;
    track.classList.remove("dragging");
    const i = cur();
    if (dx < -50) show(i + 1);
    else if (dx > 50) show(i - 1);
    else show(i);
  };
  deck.addEventListener("pointerup", endDrag);
  deck.addEventListener("pointercancel", endDrag);

  go.addEventListener("click", () => {
    if (state.mode === "vs") startVs();
    else if (state.mode === "fast") startFast();
    else startStage(state.stage);
  });
  show(cur(), true);
}

/* ---------- Fast & Furious: pick a topic, set a stopwatch, answer as many as you can ---------- */
const FAST_PRESETS = [30, 60, 90, 120];
const FAST_PENALTY = 3000;
let fastTick = null, fastTimers = [];
function fastLater(fn, ms) { const t = setTimeout(fn, ms); fastTimers.push(t); return t; }
function stopFast() {
  clearInterval(fastTick); fastTick = null;
  fastTimers.forEach(clearTimeout); fastTimers = [];
  document.getElementById("boardAi").classList.remove("low", "hit");
  document.getElementById("boardYou").classList.remove("lead");
}
function getTopic(id) { return TOPICS.find(t => t.id === id) || TOPICS[0]; }
function pad2(n) { return n < 10 ? "0" + n : String(n); }
function fmtTime(ms) {
  const t = Math.max(0, ms);
  if (t >= 60000) return Math.floor(t / 60000) + ":" + pad2(Math.floor(t / 1000) % 60);
  return (Math.floor(t / 100) / 10).toFixed(1);
}
function fastMult(streak) { return streak >= 6 ? 3 : streak >= 3 ? 2 : 1; }
function setBoardText(id, v, bump) {
  const n = document.getElementById(id);
  if (n.textContent === String(v)) return;
  n.textContent = String(v);
  if (bump) { n.classList.remove("bump"); void n.offsetWidth; n.classList.add("bump"); }
}

function startFast() {
  stopFast();
  hideKid();
  const cfg = state.fast;
  const secs = Math.min(600, Math.max(10, Math.round(Number(cfg.secs)) || 60));
  cfg.secs = secs; save();
  run = { fast: { topic: cfg.topic, secs, score: 0, streak: 0, bestStreak: 0, correct: 0, total: 0, sumMs: 0, endAt: 0, locked: false, q: null, lastQ: "", qStart: 0, btns: null } };
  showBoard(true);
  document.getElementById("youLabel").textContent = "Score";
  document.getElementById("aiLabel").textContent = "Time";
  setBoardText("youScore", 0, false);
  setBoardText("aiScore", fmtTime(secs * 1000), false);
  document.getElementById("rail").hidden = true;
  document.getElementById("homeBtn").hidden = false;
  fastCountdown(3);
}

function fastCountdown(n) {
  const f = run.fast, card = document.getElementById("card");
  card.className = "card fast-intro";
  card.replaceChildren(
    el("div", "eyebrow", getTopic(f.topic).name + " · " + f.secs + " seconds"),
    el("div", "count", n > 0 ? String(n) : "GO!"),
    el("p", "", "Each wrong answer costs 3 seconds. Keys 1 to 4 pick an answer."));
  fastLater(n > 0 ? () => fastCountdown(n - 1) : beginFast, n > 0 ? 700 : 450);
}

function beginFast() {
  const f = run.fast;
  f.endAt = Date.now() + f.secs * 1000;
  fastTick = setInterval(fastUpdate, 100);
  fastNext();
}

function fastUpdate() {
  if (!run || !run.fast) return;
  const f = run.fast, left = f.endAt - Date.now();
  setBoardText("aiScore", fmtTime(left), false);
  const low = left <= 10000;
  document.getElementById("boardAi").classList.toggle("low", low);
  const bar = document.getElementById("fastBar");
  if (bar) {
    bar.style.width = Math.max(0, Math.min(100, left / (f.secs * 1000) * 100)) + "%";
    bar.parentNode.classList.toggle("low", low);
  }
  if (left <= 0) finishFast();
}

function comboText(streak) { return "Streak " + streak + (fastMult(streak) > 1 ? " · ×" + fastMult(streak) : ""); }

function fastNext() {
  const f = run.fast;
  f.locked = false;
  const T = getTopic(f.topic);
  let q = null;
  for (let t = 0; t < 30; t++) {
    const c = pickOf(T.gen)();
    if (!c) continue;
    if (!q) q = c;
    if (c.q !== f.lastQ) { q = c; break; }
  }
  if (!q) q = g11();
  f.q = q; f.lastQ = q.q; f.qStart = Date.now();
  const card = document.getElementById("card");
  card.className = "card fast";
  card.replaceChildren();
  const meta = el("div", "meta");
  const nm = el("div", "stage-name", "Fast & Furious");
  nm.append(el("small", "", T.name));
  const combo = el("div", "combo" + (fastMult(f.streak) > 1 ? " hot" : ""), comboText(f.streak));
  combo.id = "fastCombo";
  meta.append(nm, combo);
  const bar = el("div", "fbar"), fill = el("i");
  fill.id = "fastBar";
  fill.style.width = Math.max(0, Math.min(100, (f.endAt - Date.now()) / (f.secs * 10))) + "%";
  bar.append(fill);
  card.append(meta, bar, el("p", "q", q.q));
  if (q.h) card.append(el("p", "qhint", q.h));
  const opts = el("div", "opts");
  f.btns = q.o.map((t, k) => {
    const b = el("button", "opt", t);
    b.type = "button";
    b.addEventListener("click", () => fastAnswer(k));
    opts.append(b);
    return b;
  });
  const msg = el("div", "fmsg", "");
  msg.id = "fastMsg";
  card.append(opts, msg);
}

function fastAnswer(k) {
  const f = run && run.fast;
  if (!f || f.locked || fastTick === null || !f.q) return;
  if (f.endAt - Date.now() <= 0) return;
  f.locked = true;
  const Q = f.q, ok = k === Q.a;
  f.total++;
  f.sumMs += Date.now() - f.qStart;
  f.btns.forEach((b, i) => { b.disabled = true; b.classList.add(i === Q.a ? "right" : i === k ? "wrong" : "dim"); });
  const msg = document.getElementById("fastMsg");
  if (ok) {
    f.correct++; f.streak++; f.bestStreak = Math.max(f.bestStreak, f.streak);
    const m = fastMult(f.streak), pts = 10 * m;
    f.score += pts;
    msg.textContent = "+" + pts + (m > 1 ? " · combo ×" + m : "");
    msg.className = "fmsg ok";
    setBoardText("youScore", f.score, true);
  } else {
    f.streak = 0; f.endAt -= FAST_PENALTY;
    msg.textContent = "Wrong, −3 s. Answer: " + Q.o[Q.a];
    msg.className = "fmsg no";
    const b = document.getElementById("boardAi");
    b.classList.add("hit");
    fastLater(() => b.classList.remove("hit"), 450);
  }
  const combo = document.getElementById("fastCombo");
  if (combo) { combo.textContent = comboText(f.streak); combo.classList.toggle("hot", fastMult(f.streak) > 1); }
  fastUpdate();
  if (fastTick !== null) fastLater(() => { if (run && run.fast === f && fastTick !== null) fastNext(); }, ok ? 260 : 650);
}

function finishFast() {
  const f = run.fast;
  clearInterval(fastTick); fastTick = null;
  fastTimers.forEach(clearTimeout); fastTimers = [];
  document.getElementById("boardAi").classList.remove("low", "hit");
  setBoardText("aiScore", fmtTime(0), false);
  if (!state.best) state.best = {};
  const key = f.topic + "-" + f.secs;
  const prev = state.best[key] || 0;
  const isBest = f.score > prev;
  if (isBest) { state.best[key] = f.score; save(); }
  const T = getTopic(f.topic);
  const card = document.getElementById("card");
  card.className = "card";
  card.replaceChildren();
  const wrap = el("div", "result-box");
  wrap.append(el("div", "eyebrow", "Fast & Furious · " + T.name + " · " + f.secs + " s"));
  const score = el("div", "score", String(f.score));
  score.append(el("span", "", " pts"));
  wrap.append(score, el("h2", "", isBest ? "New personal best!" : "Time's up"),
    el("p", "", isBest ? (prev > 0 ? "You beat your old best of " + prev + "." : "First score on the board for this topic and time.") : "Your best for this topic and time is " + prev + "."));
  const acc = f.total ? Math.round(100 * f.correct / f.total) : 0;
  const avg = f.total ? (f.sumMs / f.total / 1000).toFixed(1) + " s" : "n/a";
  const bd = el("div", "breakdown");
  [["Correct", f.correct + " / " + f.total], ["Accuracy", acc + "%"], ["Best streak", String(f.bestStreak)], ["Avg per answer", avg]].forEach(([l, v]) => {
    const d = el("div", "", l);
    d.append(el("b", "", v));
    bd.append(d);
  });
  wrap.append(bd);
  const row = el("div", "row");
  const again = el("button", "btn primary", "Play again");
  again.type = "button";
  again.addEventListener("click", startFast);
  const change = el("button", "btn", "Change topic or time");
  change.type = "button";
  change.addEventListener("click", showWelcome);
  row.append(again, change);
  wrap.append(row);
  card.append(wrap);
  if (isBest && f.score > 0) burst();
}

document.addEventListener("keydown", e => {
  if (!run || !run.fast || fastTick === null || run.fast.locked || !run.fast.q) return;
  const k = "1234".indexOf(e.key);
  if (k >= 0 && k < run.fast.q.o.length) fastAnswer(k);
});


function renderRail() {
  const rail = document.getElementById("rail");
  document.getElementById("homeBtn").hidden = false;
  if (run && (run.vs || run.chap)) { rail.hidden = true; return; }
  rail.hidden = false;
  rail.replaceChildren();
  STAGES.forEach((s, i) => {
    const b = el("button", "step");
    b.type = "button";
    const sc = state.scores[i];
    if (i === state.stage) b.classList.add("current");
    if (sc !== null && sc >= PASS) b.classList.add("done");
    b.append(el("span", "n", "Level " + (i + 1)), el("span", "t", s.name),
      el("span", "s", sc === null ? "Not tried" : "Best " + sc + " / " + LEVEL_Q));
    b.addEventListener("click", () => startStage(i));
    rail.append(b);
  });
}

function startStage(i, vs) {
  if (!vs) { state.stage = i; save(); }
  if (vs) { vs.lvYou = 0; vs.lvAi = 0; }
  run = { stage: i, i: 0, picked: null, results: [], qs: freshQuestions(i), vs: vs || null };
  render();
}

function render() {
  if (run.picked === null) hideKid();
  if (run.vs) {
    if (run.picked === null) { shownYou = run.vs.you; shownAi = run.vs.ai; }
    showBoard(true);
    updateBoard(false);
  } else {
    showBoard(false);
  }
  renderRail();
  const card = document.getElementById("card");
  card.className = "card";
  card.replaceChildren();
  const S = run.chap ? { name: run.chap.title, note: "Class 10 Maths · " + run.chap.unit, qs: run.qs } : { name: STAGES[run.stage].name, note: STAGES[run.stage].note, qs: run.qs };
  if (run.i >= S.qs.length) return renderResult(card, S);

  const Q = S.qs[run.i];
  const meta = el("div", "meta");
  const nm = el("div", "stage-name", run.chap ? "Chapter " + run.chap.n + " · " + S.name : "Level " + (run.stage + 1) + " · " + S.name);
  nm.append(el("small", "", S.note + " · question " + (run.i + 1) + " of " + S.qs.length));
  const dots = el("div", "dots");
  S.qs.forEach((_, k) => {
    let c = "dot";
    if (k < run.results.length) c += run.results[k] ? " ok" : " no";
    else if (k === run.i) c += " on";
    dots.append(el("span", c));
  });
  meta.append(nm, dots);
  card.append(meta);
  if (run.chap) card.append(summaryBox(run.chap));
  card.append(el("p", "q", Q.q));
  if (Q.h) card.append(el("p", "qhint", Q.h));

  const opts = el("div", "opts");
  Q.o.forEach((t, k) => {
    const b = el("button", "opt", t);
    b.type = "button";
    if (run.picked !== null) {
      b.disabled = true;
      if (k === Q.a) b.classList.add("right");
      else if (k === run.picked) b.classList.add("wrong");
      else b.classList.add("dim");
    } else {
      b.addEventListener("click", () => answer(k));
    }
    opts.append(b);
  });
  card.append(opts);

  if (run.picked !== null) {
    const ok = run.picked === Q.a;
    const fb = el("div", "feedback " + (ok ? "ok" : "no"));
    const pts = 10 * (run.stage + 1);
    if (ok) fb.append(el("b", "", run.vs ? "Correct · +" + pts : "Correct"), el("span", "", Q.e));
    else fb.append(el("b", "", "Not quite. The answer is " + Q.o[Q.a]));
    if (run.vs) fb.append(el("span", "ai-line" + (run.aiShown && run.aiOk ? " ok" : ""), run.aiShown ? run.aiText : "AI is thinking…"));
    const row = el("div", "row");
    const last = run.i === S.qs.length - 1;
    const nx = el("button", "btn primary", last ? "See result" : "Next question");
    nx.type = "button";
    nx.addEventListener("click", () => { if (run.vs) clearTimeout(run.aiTimer); run.i++; run.picked = null; render(); });
    row.append(nx);
    if (!ok && synth) {
      const again = el("button", "btn", "Hear again");
      again.type = "button";
      again.addEventListener("click", () => say(run.lastSpeech, true));
      row.append(again);
    }
    card.append(fb, row);
    nx.focus({ preventScroll: true });
  }
}

function answer(k) {
  const Q = run.qs[run.i];
  const ok = k === Q.a;
  run.picked = k;
  run.results.push(ok);
  if (run.vs) {
    const pts = 10 * (run.stage + 1);
    const aiOk = Math.random() < AI_TIERS[run.stage].p;
    let aiPick = Q.a;
    if (!aiOk) { const ws = [0, 1, 2, 3].filter(x => x !== Q.a); aiPick = ws[ri(0, ws.length - 1)]; }
    if (ok) { run.vs.you += pts; run.vs.lvYou += pts; }
    if (aiOk) { run.vs.ai += pts; run.vs.lvAi += pts; }
    run.aiOk = aiOk;
    run.aiShown = false;
    run.aiText = aiOk ? "AI got it right (+" + pts + ")" : "AI chose " + Q.o[aiPick] + " (+0)";
    clearTimeout(run.aiTimer);
    run.aiTimer = setTimeout(revealAi, 900);
  }
  render();
  if (run.vs) { shownYou = run.vs.you; updateBoard(true); }
  const line = ok ? CHEERS[ri(0, CHEERS.length - 1)] : "No worries! Here is how it works. " + Q.e;
  run.lastSpeech = ok ? line : "The answer is " + Q.o[Q.a] + ". " + Q.e;
  showKid(ok, line);
  say(ok ? line : "No worries! The answer is " + Q.o[Q.a] + ". Here is how it works. " + Q.e);
  const row = document.querySelector("#card .row");
  if (row) setTimeout(() => row.scrollIntoView({ block: "center", behavior: "smooth" }), 80);
}

function renderVsResult(card, S) {
  const v = run.vs;
  const last = run.stage === STAGES.length - 1;
  const tier = AI_TIERS[run.stage].name;
  const wrap = el("div", "result-box");
  wrap.append(el("div", "eyebrow", "Level " + (run.stage + 1) + " · " + S.name + " · result"));
  const box = (label, n, cls) => { const d = el("div"); d.append(el("small", "", label), el("b", cls, String(n))); return d; };
  let title, body;
  if (last) {
    title = v.you > v.ai ? "You beat the AI!" : v.you < v.ai ? "The AI wins this time" : "It's a draw";
    body = "Final score: you " + v.you + ", AI " + v.ai + ". Play again to see if you can finish ahead.";
  } else {
    title = v.lvYou > v.lvAi ? "You won this level" : v.lvYou < v.lvAi ? "The " + tier + " AI won this level" : "This level is a draw";
    body = "Next up: Level " + (run.stage + 2) + " against the " + AI_TIERS[run.stage + 1].name + " AI, worth " + (10 * (run.stage + 2)) + " points per answer.";
  }
  wrap.append(el("h2", "", title), el("p", "", body));
  const lv = el("div", "vs-total");
  lv.append(box("You · this level", v.lvYou, "yb"), box("AI · this level", v.lvAi, "ab"));
  wrap.append(lv);
  const tot = el("div", "vs-total");
  tot.append(box("You · match total", v.you, "yb"), box("AI · match total", v.ai, "ab"));
  wrap.append(tot);
  const row = el("div", "row");
  if (!last) {
    const n = el("button", "btn primary", "Start level " + (run.stage + 2));
    n.type = "button";
    n.addEventListener("click", () => startStage(run.stage + 1, run.vs));
    row.append(n);
  } else {
    const again = el("button", "btn primary", "Play again");
    again.type = "button";
    again.addEventListener("click", startVs);
    row.append(again);
  }
  const q = el("button", "btn", last ? "Back to start" : "Quit match");
  q.type = "button";
  q.addEventListener("click", showWelcome);
  row.append(q);
  wrap.append(row);
  card.append(wrap);
  if (last ? v.you > v.ai : v.lvYou > v.lvAi) burst();
}

function renderResult(card, S) {
  if (run.chap) return renderChapResult(card, S);
  if (run.vs) return renderVsResult(card, S);
  const sc = run.results.filter(Boolean).length;
  const prev = state.scores[run.stage];
  if (prev === null || sc > prev) state.scores[run.stage] = sc;
  save();
  renderRail();
  const passed = sc >= PASS;
  const lastStage = run.stage === STAGES.length - 1;
  const wrap = el("div", "result-box");
  wrap.append(el("div", "eyebrow", "Level " + (run.stage + 1) + " · " + S.name));
  const score = el("div", "score", String(sc));
  score.append(el("span", "", " / " + S.qs.length));
  wrap.append(score);
  let title, body;
  if (passed && lastStage) {
    const total = state.scores.reduce((a, b) => a + (b || 0), 0);
    title = "Ladder complete";
    body = "Your best total across all four levels is " + total + " out of " + LEVEL_Q * 4 + ".";
  } else if (passed) {
    title = "Level cleared";
    body = "Level " + (run.stage + 2) + " (" + STAGES[run.stage + 1].name + ") is next.";
  } else {
    title = "Almost there";
    body = "You need " + PASS + " correct to clear a level. Try again with new questions.";
  }
  wrap.append(el("h2", "", title), el("p", "", body));
  if (passed && lastStage) {
    const bd = el("div", "breakdown");
    STAGES.forEach((st, i) => {
      const d = el("div", "", st.name);
      d.append(el("b", "", (state.scores[i] ?? 0) + " / " + LEVEL_Q));
      bd.append(d);
    });
    wrap.append(bd);
  }
  const row = el("div", "row");
  if (passed && !lastStage) {
    const n = el("button", "btn primary", "Start level " + (run.stage + 2));
    n.type = "button";
    n.addEventListener("click", () => startStage(run.stage + 1));
    row.append(n);
  }
  const r = el("button", passed && !lastStage ? "btn" : "btn primary", "Retry level " + (run.stage + 1));
  r.type = "button";
  r.addEventListener("click", () => startStage(run.stage));
  row.append(r);
  if (passed && lastStage) {
    const all = el("button", "btn", "Start over");
    all.type = "button";
    all.addEventListener("click", () => { state = { scores: [null, null, null, null], stage: 0, mode: state.mode, section: state.section, fast: state.fast, best: state.best, chap: state.chap }; save(); showWelcome(); });
    row.append(all);
  }
  if (!(passed && lastStage)) {
    const hm = el("button", "btn", "Choose level");
    hm.type = "button";
    hm.addEventListener("click", showWelcome);
    row.append(hm);
  }
  wrap.append(row);
  card.append(wrap);
  if (passed) burst();
}

/* ---------- Opening screen ---------- */
const SPLASH_FORMULAS = ["a² + b² = c²", "e^(iπ) + 1 = 0", "∫ x dx = x²/2", "n(n+1)/2", "sin²θ + cos²θ = 1", "x = (−b ± √(b² − 4ac)) / 2a", "π ≈ 3.14159", "Σ 1/n²", "f′(x)", "√2 ≈ 1.414", "7 × 8 = 56", "A = πr²"];
function buildSplash() {
  const NS = "http://www.w3.org/2000/svg";
  const art = document.getElementById("spArt");
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 800 800");
  svg.setAttribute("preserveAspectRatio", "xMidYMid slice");
  const add = (tag, attrs, text) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (text !== undefined) n.textContent = text;
    svg.append(n);
    return n;
  };
  const ox = 400, oy = 340;
  add("line", { class: "ax", x1: 0, y1: oy, x2: 800, y2: oy });
  add("line", { class: "ax", x1: ox, y1: 0, x2: ox, y2: 800 });
  for (let t = -7; t <= 7; t++) {
    if (!t) continue;
    add("line", { class: "ax", x1: ox + t * 50, y1: oy - 5, x2: ox + t * 50, y2: oy + 5 });
    add("line", { class: "ax", x1: ox - 5, y1: oy + t * 50, x2: ox + 5, y2: oy + t * 50 });
  }
  let d = "";
  for (let u = -3.2; u <= 3.2; u += 0.1) d += (d ? "L" : "M") + (ox + u * 100).toFixed(1) + " " + (oy - u * u * 55).toFixed(1);
  add("path", { class: "curve c1", d, pathLength: "1" });
  d = "";
  for (let x = 0; x <= 800; x += 8) d += (d ? "L" : "M") + x + " " + (oy - 70 * Math.sin((x - ox) / 55)).toFixed(1);
  add("path", { class: "curve c2", d, pathLength: "1" });
  add("circle", { class: "unit", cx: ox, cy: oy, r: 100 });
  add("polygon", { class: "tri", points: "470,660 700,660 700,515" });
  add("path", { class: "rt", d: "M678 660 V638 H700" });
  add("text", {x: 570, y: 688}, "a");
  add("text", {x: 716, y: 596}, "b");
  add("text", {x: 566, y: 576}, "c");
  add("text", { class: "hl", x: 640, y: 150 }, "y = x²");
  add("text", { class: "hl", x: 24, y: 450 }, "y = sin x");
  add("text", { class: "hl", x: ox + 110, y: oy + 34 }, "r = 1");
  art.append(svg);
  SPLASH_FORMULAS.forEach((f, i) => {
    const n = el("span", "sp-f" + (i % 3 === 2 ? " alt" : ""), f);
    n.style.left = ((i * 29 + 4) % 62) + "%";
    n.style.top = (4 + ((i * 17) % 52)) + "%";
    n.style.fontSize = (14 + ((i * 7) % 14)) + "px";
    n.style.setProperty("--d", (11 + (i % 6) * 2) + "s");
    n.style.animationDelay = (-i * 1.1) + "s";
    art.append(n);
  });
}
function closeSplash() {
  const s = document.getElementById("splash");
  s.classList.add("leaving");
  document.body.classList.remove("splash-on");
  setTimeout(() => { s.hidden = true; }, 520);
}

document.getElementById("homeBtn").addEventListener("click", showWelcome);
buildBackdrop();
buildSplash();
showWelcome();
document.body.classList.add("splash-on");
const splashBtn = document.getElementById("splashStart");
splashBtn.addEventListener("click", closeSplash);
splashBtn.focus({ preventScroll: true });
</script>
